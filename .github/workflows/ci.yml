name: CI

# A red suite went unnoticed once because nothing ran it but a person remembering to.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Both, on purpose. Development is on Windows, so Linux is where path-separator and
    # case-sensitivity mistakes surface; Windows is where the tests whose subject exists only
    # there (subst drives, hard-link names) run instead of being reported as skipped.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
