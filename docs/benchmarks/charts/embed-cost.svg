<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">What a chunk costs to embed, CPU only (logarithmic axis)</title><desc id="d">Horizontal bars on a logarithmic axis from 1 to 1000 milliseconds. The placeholder and the corpus-fitted embedder take under 4 milliseconds per chunk on both operating systems; the pretrained model takes about 600 on Windows and 660 in the Linux container.</desc>
<rect width="640" height="300" fill="#fcfcfb"/>
<text x="16" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">What a chunk costs to embed, CPU only (logarithmic axis)</text>
<text x="16" y="44" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">First index of the 20-document corpus, milliseconds per chunk. Note the axis: each gridline is ten times the last.</text><line x1="120" x2="120" y1="64" y2="234" stroke="#c3c2b7" stroke-width="1"/><text x="120" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">1 ms</text><line x1="280" x2="280" y1="64" y2="234" stroke="#e1e0d9" stroke-width="1"/><text x="280" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">10 ms</text><line x1="440" x2="440" y1="64" y2="234" stroke="#e1e0d9" stroke-width="1"/><text x="440" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">100 ms</text><line x1="600" x2="600" y1="64" y2="234" stroke="#e1e0d9" stroke-width="1"/><text x="600" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">1,000 ms</text><text x="110" y="95.33333333333333" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">programmable</text><path d="M120,71.33333333333333 h36.843600816528976 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-36.843600816528976 z" fill="#4a3aa7"/><text x="166.84360081652898" y="85.33333333333333" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1.8 ms</text><path d="M120,93.33333333333333 h40.60057615245262 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-40.60057615245262 z" fill="#008300"/><text x="170.60057615245262" y="107.33333333333333" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">1.9 ms</text><text x="110" y="152" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">lsa</text><path d="M120,127.99999999999999 h83.05088709604411 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-83.05088709604411 z" fill="#4a3aa7"/><text x="213.0508870960441" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">3.5 ms</text><path d="M120,150 h76.82399653118495 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-76.82399653118495 z" fill="#008300"/><text x="206.82399653118495" y="164" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">3.2 ms</text><text x="110" y="208.66666666666666" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">ollama</text><path d="M120,184.66666666666666 h440.53893493693977 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-440.53893493693977 z" fill="#4a3aa7"/><text x="570.5389349369398" y="198.66666666666666" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">600.3 ms</text><path d="M120,206.66666666666666 h446.8633211458873 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-446.8633211458873 z" fill="#008300"/><text x="576.8633211458873" y="220.66666666666666" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">657.5 ms</text><rect x="120" y="273" width="12" height="12" rx="2" fill="#4a3aa7"/><text x="137" y="283" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Windows (host)</text><rect x="247.39999999999998" y="273" width="12" height="12" rx="2" fill="#008300"/><text x="264.4" y="283" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Linux (container on the same machine)</text></svg>
