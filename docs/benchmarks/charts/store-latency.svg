<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">Store latency as the corpus grows: median query time</title><desc id="d">Two line charts, Windows and Linux, each with the blob store and the sqlite-vec store over 500, 2000 and 8000 documents. Blob rises to 35 milliseconds on Windows and 52 on Linux; sqlite-vec stays under 3 milliseconds on both.</desc>
<rect width="640" height="340" fill="#fcfcfb"/>
<text x="16" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Store latency as the corpus grows: median query time</text>
<text x="16" y="44" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Same placeholder embedder throughout; p50 over the labelled queries, one shared axis.</text><text x="56" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Windows</text><line x1="56" x2="312" y1="264" y2="264" stroke="#c3c2b7" stroke-width="1"/><text x="48" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">0 ms</text><line x1="56" x2="312" y1="204" y2="204" stroke="#e1e0d9" stroke-width="1"/><text x="48" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">20 ms</text><line x1="56" x2="312" y1="144" y2="144" stroke="#e1e0d9" stroke-width="1"/><text x="48" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">40 ms</text><line x1="56" x2="312" y1="84" y2="84" stroke="#e1e0d9" stroke-width="1"/><text x="48" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">60 ms</text><text x="76" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">500</text><text x="184" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">2,000</text><text x="292" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">8,000</text><path d="M76,259.2 L184,242.1 L292,158.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76" cy="259.2" r="6" fill="#fcfcfb"/><circle cx="76" cy="259.2" r="4" fill="#2a78d6"/><circle cx="184" cy="242.1" r="6" fill="#fcfcfb"/><circle cx="184" cy="242.1" r="4" fill="#2a78d6"/><circle cx="292" cy="158.4" r="6" fill="#fcfcfb"/><circle cx="292" cy="158.4" r="4" fill="#2a78d6"/><text x="284" y="148.4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">35.2 ms</text><path d="M76,262.8 L184,261.6 L292,256.5" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="76" cy="262.8" r="6" fill="#fcfcfb"/><circle cx="76" cy="262.8" r="4" fill="#eb6834"/><circle cx="184" cy="261.6" r="6" fill="#fcfcfb"/><circle cx="184" cy="261.6" r="4" fill="#eb6834"/><circle cx="292" cy="256.5" r="6" fill="#fcfcfb"/><circle cx="292" cy="256.5" r="4" fill="#eb6834"/><text x="284" y="246.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">2.5 ms</text><text x="360" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Linux</text><line x1="360" x2="616" y1="264" y2="264" stroke="#c3c2b7" stroke-width="1"/><text x="352" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">0 ms</text><line x1="360" x2="616" y1="204" y2="204" stroke="#e1e0d9" stroke-width="1"/><text x="352" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">20 ms</text><line x1="360" x2="616" y1="144" y2="144" stroke="#e1e0d9" stroke-width="1"/><text x="352" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">40 ms</text><line x1="360" x2="616" y1="84" y2="84" stroke="#e1e0d9" stroke-width="1"/><text x="352" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">60 ms</text><text x="380" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">500</text><text x="488" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">2,000</text><text x="596" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" style="font-variant-numeric: tabular-nums">8,000</text><path d="M380,254.7 L488,231 L596,107.69999999999999" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="380" cy="254.7" r="6" fill="#fcfcfb"/><circle cx="380" cy="254.7" r="4" fill="#2a78d6"/><circle cx="488" cy="231" r="6" fill="#fcfcfb"/><circle cx="488" cy="231" r="4" fill="#2a78d6"/><circle cx="596" cy="107.69999999999999" r="6" fill="#fcfcfb"/><circle cx="596" cy="107.69999999999999" r="4" fill="#2a78d6"/><text x="588" y="97.69999999999999" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">52.1 ms</text><path d="M380,262.5 L488,261.9 L596,256.2" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="380" cy="262.5" r="6" fill="#fcfcfb"/><circle cx="380" cy="262.5" r="4" fill="#eb6834"/><circle cx="488" cy="261.9" r="6" fill="#fcfcfb"/><circle cx="488" cy="261.9" r="4" fill="#eb6834"/><circle cx="596" cy="256.2" r="6" fill="#fcfcfb"/><circle cx="596" cy="256.2" r="4" fill="#eb6834"/><text x="588" y="246.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" style="font-variant-numeric: tabular-nums">2.6 ms</text><rect x="56" y="313" width="12" height="12" rx="2" fill="#2a78d6"/><text x="73" y="323" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">blob store (cosine in managed code)</text><rect x="322" y="313" width="12" height="12" rx="2" fill="#eb6834"/><text x="339" y="323" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">sqlite-vec store (native k-NN)</text></svg>
